name: PReviewer
description: Review PRs with pluggable AI coding agents
author: Vaibhav Pandey
branding:
  icon: check-circle
  color: purple
inputs:
  token:
    description: "GitHub token used to interact with the repository API and create reviews"
    required: false
    default: ${{ github.token }}
  agent:
    description: "Review agent backend to use (default: pi)"
    required: false
    default: "pi"
  model:
    description: "Model to use with the review agent (e.g. anthropic/claude-sonnet-4-5)"
    required: false
  prompt:
    description: "Custom instructions or review criteria for the agent"
    required: false

outputs:
  review:
    description: "The review summary generated by the review agent"

runs:
  using: node20
  main: dist/gha.js
