name: Test Action

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: previewer-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit

      - name: Build action bundle
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha

  test:
    name: Test Action
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PReviewer Action
        id: previewer
        uses: ./
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          model: openai/gpt-6.1-sol

      - name: Verify Review Output
        if: always() && steps.previewer.outputs.review != ''
        run: |
          echo "### Review Summary"
          echo "${{ steps.previewer.outputs.review }}"
