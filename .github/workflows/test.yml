name: Test Action

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pireviewer-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit

      - name: Build action bundle
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha

  test:
    name: Test Action
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run PiReviewer Action
        id: pireviewer
        uses: ./
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          model: openai/gpt-6.1-sol

      - name: Verify Review Output
        env:
          REVIEW: ${{ steps.pireviewer.outputs.review }}
        run: |
          if [ -z "$REVIEW" ]; then
            echo "::error::Action finished but review output was empty"
            exit 1
          fi
          echo "### Review Summary"
          printf '%s\n' "$REVIEW"
